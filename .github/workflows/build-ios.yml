name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET (No Cache)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: false

      - name: Install Workloads
        run: dotnet workload install ios maui-ios

      - name: Restore Dependencies
        run: dotnet restore OpenUtauMobile/OpenUtauMobile.csproj -f net9.0-ios

      - name: Build and Publish IPA
        run: |
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj \
            -f net9.0-ios \
            -c Debug \
            -r ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:BuildIpa=true \
            -p:EnableCodeSigning=false \
            -p:TreatWarningsAsErrors=false

      - name: Fallback Packaging (if .app built instead of .ipa)
        run: |
          if [ ! -f *.ipa ]; then
            mkdir -p Payload
            APP_PATH=$(find OpenUtauMobile/bin/Debug/net9.0-ios -name "*.app" -type d | head -n 1)
            if [ -n "$APP_PATH" ]; then
              cp -r "$APP_PATH" Payload/
              zip -r OpenUtauMobile-Debug.ipa Payload
            fi
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-IPA
          path: '**/*.ipa'
